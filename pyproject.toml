[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-policy-kit"
version = "0.1.0"
description = "Policy-as-code guardrails for AI agents: YAML rules, deterministic allow/deny decisions, and human-in-the-loop approval gates."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
authors = [{ name = "Anusha Mukka" }]
keywords = ["ai-agents", "policy-as-code", "security", "guardrails", "authorization", "human-in-the-loop", "ai-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
policy-kit = "agent_policy_kit.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
lint = ["ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/anushamukka9/agent-policy-kit"
Issues = "https://github.com/anushamukka9/agent-policy-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_policy_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
